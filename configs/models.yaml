# Model registry. Revisions are pinned commits; `settings` follow the closest prior work
# that used each model so our baselines are comparable to published numbers.
# min_gpu = smallest Markov GPU type (-C feature) that fits the job in fp16.

text_to_image:
  sd14:
    hf_id: CompVis/stable-diffusion-v1-4
    revision: 133a221b8aa7292a167afc5127cb63fb5005638b
    family: sd1
    variant: fp16
    resolution: 512
    settings: {scheduler: ddim, steps: 50, guidance: 7.5}      # Wen et al. ICLR'24; NeMo NeurIPS'24
    used_by: [Wen et al. ICLR'24, Hintersdorf et al. NeurIPS'24, Pham et al. ICLR'24, Chen et al. ICLR'25]
    download_gb: 2.7
    min_gpu: gpu2080
    note: the 500 memorized prompts were verified on this checkpoint
  sd15:
    hf_id: stable-diffusion-v1-5/stable-diffusion-v1-5   # official mirror after runwayml/ was removed
    revision: 451f4fe16113bff5a5d2269ed5ad43b0592e9a14
    family: sd1
    variant: fp16
    resolution: 512
    settings: {scheduler: ddim, steps: 50, guidance: 7.5}
    used_by: [proposal]
    download_gb: 2.7
    min_gpu: gpu2080
  sd2base:
    hf_id: sd2-community/stable-diffusion-2-base         # community mirror; stabilityai/* SD2 repos now return 401
    revision: f5bc1bd97485577aa0b946fa8a9004e2ec147402
    family: sd2
    variant: fp16
    resolution: 512
    settings: {scheduler: ddim, steps: 50, guidance: 7.5}
    used_by: [Webster 2023 (SDv2 memorized prompts), Chen et al. ICLR'25]
    download_gb: 2.6
    min_gpu: gpu2080
  sd21:
    hf_id: sd2-community/stable-diffusion-2-1            # community mirror (768px, v-prediction)
    revision: bb2154823665391b4fb29b0b9cf82a198964ee05
    family: sd2
    variant: fp16
    resolution: 768
    settings: {scheduler: default, steps: 30, guidance: 7.5}   # Reissinger et al. 2025 (SD 2): 30 steps, 7.5
    used_by: [Reissinger et al. 2025, proposal]
    download_gb: 2.6
    min_gpu: gpu4090
  sdxl:
    hf_id: stabilityai/stable-diffusion-xl-base-1.0
    revision: 462165984030d82259a11f4367a4eed129e94a7b
    family: sdxl
    variant: fp16
    resolution: 1024
    settings: {scheduler: default, steps: 50, guidance: 3.0}   # He et al. ICLR'25
    used_by: [He et al. ICLR'25, proposal]
    download_gb: 7.1
    min_gpu: gpu4090
  playground25:
    hf_id: playgroundai/playground-v2.5-1024px-aesthetic
    revision: 1e032f13f2fe6db2dc49947dbdbd196e753de573
    family: sdxl
    variant: fp16
    resolution: 1024
    settings: {scheduler: default, steps: 50, guidance: 3.0}   # He et al. ICLR'25 (main model)
    used_by: [He et al. ICLR'25]
    download_gb: 6.9
    min_gpu: gpu4090
  pixart512:
    hf_id: PixArt-alpha/PixArt-XL-2-512x512
    revision: 50f702106901db6d0f8b67eb88e814c56ded2692
    family: pixart
    variant: null
    resolution: 512
    settings: {scheduler: default, steps: 50, guidance: 3.0}   # He et al. ICLR'25
    used_by: [He et al. ICLR'25]
    download_gb: 21.0
    min_gpu: gpul40s
    note: optional (T5-XXL encoder is large); probes are UNet-only and skip this model
  tiny:
    hf_id: hf-internal-testing/tiny-stable-diffusion-torch
    revision: a88cdfbd91f96ec7f61eb7484b652ff0f4ee701d
    family: sd1
    variant: null
    resolution: 64
    settings: {scheduler: ddim, steps: 2, guidance: 7.5}
    used_by: [unit tests only]
    download_gb: 0.01
    min_gpu: cpu

