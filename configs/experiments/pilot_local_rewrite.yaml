# Milestone pilot, D4 with an open reasoning model: run scripts/run_rewriter.py first
#   python scripts/run_rewriter.py --llm rewriter_reasoning_small --thinking --ids 23,16,41,28,47 --attacks direct,lure_desc60
#   python scripts/run_generation.py --config configs/experiments/pilot_local_rewrite.yaml

defaults:
  model: sd14
  seeds: [0]
  probes: [noise, attention]

jobs:
  - name: copycat_qwen_rewrite
    dataset: copycat_characters
    ids: [23, 16, 41, 28, 47]
    attacks: [direct, lure_desc60]
    defenses: [llm_rewrite, llm_rewrite+negbuf_name_kw]
    rewrites: [outputs/rewrites/rewriter_reasoning_small_think_copycat_characters_dev.csv]
    steps: 30
