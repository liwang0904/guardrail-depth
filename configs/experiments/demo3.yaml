# Demo 3 grid: the detect-then-defend gate (G, ours; G-pre = without the output check) against the Demo 2
# baselines on the same test items, attacks, seeds and settings, plus what the Demo 2 feedback asked for:
#   * an on-prompt judge for every image (scripts/run_onprompt.py) and a safe-utility F1 per guardrail,
#   * benign near-miss requests next to the protected concepts (generic_prompts, new),
#   * two models outside the Stable Diffusion family: Playground v2.5 (SDXL architecture, other company and
#     data) and PixArt-alpha (diffusion transformer, T5 text encoder).
#
#   bash slurm/demo3_submit.sh            # submits everything below in dependency order
#
# Gate rows on the Demo 2 grid reuse a Demo 2 render whenever the gate hands the model the exact
# (prompt, negative prompt, seed) a baseline already rendered (`reuse:`), so G and the baselines are
# compared on the very same images; only requests where the gate does something no baseline did are drawn.
# Thresholds come from configs/gate.yaml, calibrated on the dev jobs below before any test job runs.

defaults:
  seeds: [0, 1]
  probes: [noise]

jobs:
  # ---------------------------------------------------------------- dev split: gate calibration only
  - name: sd14_dev_copycat
    model: sd14
    dataset: copycat_characters
    split: dev
    seeds: [0]
    attacks: [direct, lure_desc60, lure_kw_laion5, perturb_phonetic]
    defenses: [none]

  - name: sd14_dev_benign
    model: sd14
    dataset: unmemorized_laion
    split: dev
    seeds: [0]
    attacks: [direct]
    defenses: [none]

  - name: sd14_dev_generic
    model: sd14
    dataset: generic_prompts
    split: dev
    seeds: [0]
    attacks: [direct]
    defenses: [none]

  # ---------------------------------------------------------------- the gate on the Demo 2 grid
  - name: sd14_memorized
    model: sd14
    dataset: memorized_sd1
    ids: [0, 2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 16, 18, 19, 21, 22, 23, 24, 25, 28, 30, 32, 33, 34, 36, 38, 39, 40, 41, 42, 45, 46, 47, 49, 50, 51, 54, 55, 56, 57, 58, 61, 68, 69, 70, 75, 79, 83, 84, 91, 92, 93, 95, 96, 101, 108, 116, 119, 123, 124, 137, 138, 139, 144, 146, 147, 159, 161, 162, 165, 175, 187, 190, 192, 193, 200, 203, 209, 210, 217, 222, 230, 234, 235, 245, 246, 248, 253, 259, 263, 272, 273, 284, 292, 297, 299, 308, 310, 321, 322, 324, 329, 334, 357, 360, 376, 377, 378, 379, 380, 391, 404, 406, 408, 420, 426, 435, 436, 439, 444, 450, 453, 456, 469, 478, 490, 493, 497, 498]
    attacks: [direct, truncate_repeat, override]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_memorized_sd1.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_memorized_sd1.csv"]
    reuse: [demo2/sd14_memorized]

  - name: sd14_controls
    model: sd14
    dataset: unmemorized_laion
    ids: [0, 12, 13, 17, 22, 24, 31, 33, 38, 42, 47, 64, 70, 72, 85, 96, 101, 108, 109, 112, 120, 123, 127, 129, 139, 140, 141, 144, 146, 150, 151, 152, 155, 159, 176, 183, 188, 191, 192, 195, 197, 199, 203, 204, 208, 209, 215, 229, 230, 231, 236, 249, 253, 263, 266, 267, 271, 275, 279, 282, 284, 285, 286, 290, 292, 294, 305, 314, 320, 326, 332, 351, 354, 356, 361, 362, 370, 387, 396, 397, 401, 403, 406, 407, 409, 413, 421, 425, 431, 450, 456, 459, 462, 464, 466, 469, 472, 473, 478, 493]
    attacks: [direct]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_unmemorized_laion.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_unmemorized_laion.csv"]
    reuse: [demo2/sd14_controls]

  - name: sd2_memorized
    model: sd2base
    dataset: memorized_sd2
    ids: [0, 1, 3, 4, 6, 9, 10, 14, 16, 18, 20, 21, 22, 26, 29, 30, 31, 32, 34, 35, 38, 39, 41, 44, 46, 50, 51, 57, 59, 60, 61, 68, 70, 73, 74, 77, 79, 81, 82, 84, 85, 86, 90, 91, 92, 93, 95, 100, 101, 105, 107, 108, 110, 112, 113, 115, 116, 118, 122, 124, 125, 126, 128, 131, 134, 135, 139, 142, 144, 146, 147, 148, 154, 156, 157, 159, 164, 170, 172, 173, 174, 176, 178, 179, 187, 188, 189, 190, 191, 192, 196, 200, 201, 202, 205, 207, 209, 210, 211, 218]
    attacks: [direct]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_memorized_sd2.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_memorized_sd2.csv"]
    reuse: [demo2/sd2_memorized]

  - name: sd14_copycat
    model: sd14
    dataset: copycat_characters
    split: test
    attacks: [direct, lure_desc60, lure_kw_laion5, perturb_phonetic]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_copycat_characters.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_copycat_characters.csv"]
    reuse: [demo2/sd14_copycat]

  - name: sdxl_copycat
    model: sdxl
    dataset: copycat_characters
    split: test
    seeds: [0]
    attacks: [direct, lure_desc60, lure_kw_laion5, perturb_phonetic]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_copycat_characters.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_copycat_characters.csv"]
    reuse: [demo2/sdxl_copycat]

  - name: sd14_style
    model: sd14
    dataset: style_prompts
    split: test
    seeds: [0]
    attacks: [direct, perturb_phonetic]
    defenses: [gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_style_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_style_prompts.csv"]
    reuse: [demo2/sd14_style]

  # ---------------------------------------------------------------- benign near-miss requests (new set)
  # "a cartoon mermaid": the generic thing each protected character is, no name, no identifying detail.
  # Measures over-blocking next to protected concepts and characters the model draws unasked.
  - name: sd14_generic
    model: sd14
    dataset: generic_prompts
    split: test
    attacks: [direct]
    defenses: [none, blocklist, task_instruction, neg_inprompt, negbuf_name_kw, cot, llm_rewrite,
               llm_rewrite+negbuf_name_kw, rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo3_generic_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_generic_prompts.csv"]

  - name: sdxl_generic
    model: sdxl
    dataset: generic_prompts
    split: test
    seeds: [0]
    attacks: [direct]
    defenses: [none, blocklist, task_instruction, negbuf_name_kw, llm_rewrite, llm_rewrite+negbuf_name_kw,
               rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo3_generic_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_generic_prompts.csv"]

  # ---------------------------------------------------------------- models outside Stable Diffusion
  # Characters and styles only: the memorized prompts are specific to SD's training data. The templates
  # D2a and D3 behaved like D1 on characters in Demo 2, so D1 stands for the template family here.
  - name: playground_copycat
    model: playground25
    dataset: copycat_characters
    split: test
    seeds: [0]
    attacks: [direct, lure_desc60, lure_kw_laion5, perturb_phonetic]
    defenses: [none, blocklist, task_instruction, negbuf_name_kw, llm_rewrite, llm_rewrite+negbuf_name_kw,
               rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_copycat_characters.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_copycat_characters.csv"]

  - name: playground_generic
    model: playground25
    dataset: generic_prompts
    split: test
    seeds: [0]
    attacks: [direct]
    defenses: [none, blocklist, task_instruction, negbuf_name_kw, llm_rewrite, llm_rewrite+negbuf_name_kw,
               rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo3_generic_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_generic_prompts.csv"]

  # one template of each structural type (simple, two-entity, entity-attribute, entity-scene)
  - name: playground_style
    model: playground25
    dataset: style_prompts
    split: test
    query: "template_id in [0, 3, 5, 8]"
    seeds: [0]
    attacks: [direct, perturb_phonetic]
    defenses: [none, blocklist, task_instruction, negbuf_name, llm_rewrite, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_style_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_style_prompts.csv"]

  - name: pixart_copycat
    model: pixart512
    dataset: copycat_characters
    split: test
    seeds: [0]
    attacks: [direct, lure_desc60, lure_kw_laion5, perturb_phonetic]
    defenses: [none, blocklist, task_instruction, negbuf_name_kw, llm_rewrite, llm_rewrite+negbuf_name_kw,
               rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_copycat_characters.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_copycat_characters.csv"]

  - name: pixart_generic
    model: pixart512
    dataset: generic_prompts
    split: test
    seeds: [0]
    attacks: [direct]
    defenses: [none, blocklist, task_instruction, negbuf_name_kw, llm_rewrite, llm_rewrite+negbuf_name_kw,
               rand_tokens, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo3_generic_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_generic_prompts.csv"]

  - name: pixart_style
    model: pixart512
    dataset: style_prompts
    split: test
    query: "template_id in [0, 3, 5, 8]"
    seeds: [0]
    attacks: [direct, perturb_phonetic]
    defenses: [none, blocklist, task_instruction, negbuf_name, llm_rewrite, gated, gated_pre]
    rewrites: ["$GD_OUTPUT_ROOT/rewrites/demo2_style_prompts.csv"]
    screens: ["$GD_OUTPUT_ROOT/screens/demo3_style_prompts.csv"]
